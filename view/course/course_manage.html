{extend name="common\base"/}
{block name="title"}{$title}{/block}


{block name="main"}
<div style="padding: 16px;"> 
    <div>
        <button type="button" class="layui-btn layui-bg-blue"  id="add-course">添加课程</button>
    </div>
    <table class="layui-hide" id="course-list"></table>
</div>


<div id="add-box" style="display: none;">
    <form class="layui-form" action="" lay-filter="add-val-filter">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">课程名称</label>
            <div class="layui-input-inline layui-input-wrap">
            <input type="text" name="title" lay-verify="required" autocomplete="off" lay-affix="clear" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
              <button type="submit" class="layui-btn" lay-submit lay-filter="save-btn">立即提交</button>
              <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>
    
</div>


{/block}

{block name="javascript"}
<script type="text/html" id="operation">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="edit">修改</a>
        <a class="layui-btn layui-btn-xs" lay-event="delete">删除</a>
    </div>
</script>
<script>
     // 打开修改或添加弹窗
     function openClazzDialog(title, ele) {
         layer.open({
             type: 1,
             area: ['400px', '350px'],
             title: title,
             shade: 0.6,
             shadeClose: true,
             content: ele
         });
     }

     layui.use(['jquery', 'table', 'form'], function () {
         let $ = layui.jquery;
         let form = layui.form;
         let table = layui.table;

         // 创建渲染实例
         table.render({
             elem: '#course-list',
             url: '/api/course/list',
             height: '315px',
             page: {
                 layout: ['limit', 'count', 'prev', 'page', 'next', 'skip'],
                 groups: 3,
                 first: false,
                 last: false
             },
             limit: 5,
             cols: [[
                 {type: 'checkbox', fixed: 'left'},
                 {field:'id', fixed: 'left', width:80, title: 'ID', sort: true},
                 {field:'title', width:160, title: '课程名称'},
                 {title: '操作', minWidth: 200, templet: '#operation'}
             ]]
         });

         // 触发操作列按钮
         table.on('tool(course-list)', function (obj) {
             let data = obj.data;

             if (obj.event === 'edit') {
                 form.val('add-val-filter', {
                     id: data.id,
                     title: data.title,
                 });

                 openClazzDialog('编辑课程', $('#add-box'));
             }
             else if (obj.event === 'delete') {
                 layer.confirm('确认删除此条数据吗？', {btn: ['确定', '关闭']}, function (index) {
                     layer.close(index);

                     // 点击确认，调用删除接口
                     $.ajax({
                         type: 'post',
                         url: '/api/course/delete',
                         data: {
                             id: data.id
                         },
                         dataType: 'json',
                         success(res) {
                             layer.msg(res['msg'], {icon: (res.code === SUCCESS_CODE ? SUCCESS : FAIL)});
                             table.reload('course-list');
                         }
                     });
                 });
             }
         });

         // 添加课程按钮
         $("#add-course").click(function () {
             form.val('add-val-filter', {
                 id: null,
                 title: null,
             });

             openClazzDialog('添加课程', $('#add-box'));
         });

         // 提交表单
         form.on('submit(save-btn)', function(data){
             let field = data.field;
             let id = field.id;
             let title = field.title;


             $.ajax({
                 type: 'post',
                 url: id ? '/api/course/update' : '/api/course/add',
                 data: {id, title},
                 dataType: 'json',
                 success(res) {
                     if (res.code === 0) {
                         layer.msg(res['msg'], {icon: SUCCESS});
                         layer.closeAll();
                         table.reload('course-list');
                         return;
                     }
                     layer.msg(res['msg'], {icon: FAIL});
                 }
             });

             return false;
         });
     });
</script>
{/block}
