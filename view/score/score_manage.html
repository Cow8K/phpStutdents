{extend name="common\base"/}
{block name="title"}{$title}{/block}

{block name="main"}
<div style="padding: 16px;"> 
  <div class="search-box">
    <form class="layui-form" action="" lay-filter="search-form">
        <div class="layui-form-item">
            <label class="layui-form-label">姓名</label>
            <div class="layui-input-inline">
                <input type="text" name="name" value="" placeholder="请输入姓名" autocomplete="off" class="layui-input">
            </div>

            <label class="layui-form-label">课程</label>
            <div class="layui-input-inline">
                <select name="course_id">
                <option value="">请选择</option>
                {foreach $courseList as $vo}
                    <option value="{$vo.id}">{$vo.title}</option>
                {/foreach}
                </select>
            </div>
        
            <label class="layui-form-label">年级</label>
            <div class="layui-input-inline">
                <select name="grade">
                <option value="">请选择</option>
                {foreach $gradeList as $vo}
                    <option value="{$vo}">{$vo}</option>
                {/foreach}
                </select>
            </div>
       
            <label class="layui-form-label">班级</label>
            <div class="layui-input-inline">
                <select name="class">
                <option value="">请选择</option>
                {foreach $classList as $vo}
                    <option value="{$vo}">{$vo}</option>
                {/foreach}
                </select>
            </div>

            <div class="layui-input-inline">
            <button class="layui-btn" lay-submit lay-filter="form-search">搜索</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
      </div>
    </form>
</div>
    <div>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" style="margin-bottom: 4px" id="add-score">添加成绩</button>
    </div>
</div>
<div style="padding: 15px;">
    <table class="layui-hide" id="score-list"></table>
</div>


<div id="add-box" style="display: none;">
    <form class="layui-form" action="" lay-filter="add-val-filter">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            
            <label class="layui-form-label">学生 </label>
            <div class="layui-input-inline">
                <select name="student_id">
                    <option value="">请选择</option>
                    {foreach $stuList as $key=>$vo } 
                        <option value="{$vo.id}">{$vo.name}</option>                               
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            
            <label class="layui-form-label">课程 </label>
            <div class="layui-input-inline">
                <select name="course_id">
                    <option value="">请选择</option>
                    {foreach $courseList as $key=>$vo } 
                        <option value="{$vo.id}">{$vo.title}</option>                               
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">成绩分数</label>
            <div class="layui-input-inline layui-input-wrap">
            <input type="number" name="score" lay-verify="required" autocomplete="off" lay-affix="clear" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
              <button type="submit" class="layui-btn" lay-submit lay-filter="saveBtn">提交</button>
              <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>
</div>


{/block}

{block name="javascript"}
<script type="text/html" id="operation">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="edit">修改</a>
        <a class="layui-btn layui-btn-xs" lay-event="delete">删除</a>
    </div>
</script>
<script>
    // 打开修改或添加弹窗
    function openClazzDialog(title, ele) {
        layer.open({
            type: 1,
            area: ['400px', '350px'],
            title: title,
            shade: 0.6,
            shadeClose: true,
            content: ele
        });
    }

    layui.use(['jquery', 'table', 'form'], function () {
        let $ = layui.jquery;
        let form = layui.form;
        let table = layui.table;

        // 创建渲染实例
        table.render({
            elem: '#score-list',
            url: '/api/score/list',
            height: '315px',
            page: {
                layout: ['limit', 'count', 'prev', 'page', 'next', 'skip'],
                groups: 3,
                first: false,
                last: false
            },
            limit: 5,
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field:'score', width:160, title: '成绩分数'},
                {field:'name', width:160, title: '学生'},
                {field:'title', width:160, title: '课程'},
                {field:'grade', width:160, title: '年级'},
                {field:'class', width:160, title: '班级'},
                {title: '操作', minWidth: 200, templet: '#operation'}
            ]]
        });

        // 触发操作列按钮
        table.on('tool(score-list)', function (obj) {
            let data = obj.data;

            if (obj.event === 'edit') {
                form.val('add-val-filter', {
                    id: data.id,
                    score: data.score,
                    course_id: data.course_id,
                    student_id: data.student_id,
                });

                openClazzDialog('编辑成绩', $('#add-box'));
            }
            else if (obj.event === 'delete') {
                layer.confirm('确认删除此条数据吗？', {btn: ['确定', '关闭']}, function (index) {
                    layer.close(index);

                    // 点击确认，调用删除接口
                    $.ajax({
                        type: 'post',
                        url: '/api/score/delete',
                        data: {
                            id: data.id
                        },
                        dataType: 'json',
                        success(res) {
                            layer.msg(res['msg'], {icon: (res.code === SUCCESS_CODE ? SUCCESS : FAIL)});
                            table.reload('score-list');
                        }
                    });
                });
            }
        });

        // 添加成绩按钮
        $("#add-score").click(function () {
            form.val('add-val-filter', {
                id: null,
                score: null,
                course_id: null,
                student_id: null,
            });

            openClazzDialog('添加成绩', $('#add-box'));
        });

        // 提交表单
        form.on('submit(saveBtn)', function(data){
            let field = data.field;
            let id = field.id;
            let score = field.score;
            let courseId = field.course_id;
            let studentId = field.student_id;


            $.ajax({
                type: 'post',
                url: id ? '/api/score/update' : '/api/score/add',
                data: {id, score, courseId, studentId},
                dataType: 'json',
                success(res) {
                    if (res.code === 0) {
                        layer.msg(res['msg'], {icon: SUCCESS});
                        layer.closeAll();
                        table.reload('score-list');
                        return;
                    }
                    layer.msg(res['msg'], {icon: FAIL});
                }
            });

            return false;
        });

        form.on('submit(form-search)', function(data){

            table.reload('score-list', {
                page: {
                    curr: 1
                },
                where: {
                    where:data.field
                }
            });
            return false
        });
    });
</script>
{/block}
