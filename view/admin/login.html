<!doctype html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        .con-box {
            width: 400px;
            height: 260px;
            padding: 30px;
            border: 1px solid #ddd;
            margin: 50px auto;
            border-radius: 20px;
        }

        .line {
            margin: 10px 0;
        }

        .line span {
            width: 100px;
            text-align: right;
            display: inline-block;
        }

        .line input {
            border: 1px solid #ddd;
        }

        .line input[type="submit"] {
            border: 1px solid #ddd;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 50px;
        }

    </style>
    <link href="/static/lib/layui/css/layui.css" rel="stylesheet">
    <script src="/static/lib/layui/layui.js"></script>
</head>
<body>

    <div class="con-box" style="margin: 215px auto;">
        <h1 style="text-align: center; margin-bottom: 30px;">
            管理员登录
        </h1>
        <form class="layui-form" action="" lay-filter="modify-login-form">
            <div class="layui-form-item">
                <label class="layui-form-label">账号</label>
                <div class="layui-input-inline layui-input-wrap">
                    <input type="text" name="username" lay-verify="required"
                           autocomplete="off" lay-affix="clear" class="layui-input" placeholder="请输入账号">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-inline layui-input-wrap">
                    <input type="password" name="password" lay-verify="required"
                           autocomplete="off" lay-affix="clear" class="layui-input" placeholder="请输入密码">
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit lay-filter="loginBtn">登录</button>
                </div>
            </div>
        </form>
    </div>


    <script>
        const FAIL = 2;
        const SUCCESS = 6;
        const SUCCESS_CODE = 0;

        layui.use('jquery', function (){
            let $ = layui.jquery;
            let form = layui.form;

            // 提交表单
            form.on('submit(loginBtn)', function(){
                $.ajax({
                    type: 'post',
                    url: '/api/admin/login',
                    data: {
                        username: $("[name='username']").val(),
                        password: $("[name='password']").val(),
                    },
                    dataType: 'json',
                    success(res) {
                        if (res.code === SUCCESS_CODE) {
                            layer.msg(res['msg'], {icon: SUCCESS});
                            location.href = '{$redirectUrl}';
                        }
                        else {
                            layer.msg(res['msg'], {icon: FAIL});
                        }
                    }
                });
                return false;
            });
        });
    </script>
</div>
</body>
</html>
