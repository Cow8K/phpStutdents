<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2f7, #f8fafc);
            overflow: hidden;
        }

        /* 背景光斑 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
        }

        .bg-circle.one {
            width: 300px;
            height: 300px;
            background: #c7d2fe;
            top: 10%;
            left: 15%;
        }

        .bg-circle.two {
            width: 260px;
            height: 260px;
            background: #bae6fd;
            bottom: 15%;
            right: 20%;
        }

        .login-container {
            position: relative;
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 300px;
            z-index: 2;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .login-btn:hover {
            background-color: #2563eb;
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .helper-text {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }

        .helper-text a {
            color: #3b82f6;
            text-decoration: none;
        }

        .helper-text a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="/static/lib/layui/layui.js"></script>
    <link href="/static/lib/layui/css/layui.css" rel="stylesheet">
    <link rel="preload" as="font" href="/static/lib/layui/font/iconfont.woff2?v=282" type="font/woff2" crossorigin="anonymous">
</head>
<body>

<div class="bg-circle one"></div>
<div class="bg-circle two"></div>

<div class="login-container">
    <h2>登录</h2>
    <form action="" lay-filter="modify-login-form">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="login-btn" lay-submit lay-filter="loginBtn">登录</button>
    </form>
    <p class="helper-text">还没有账号？<a href="javascript:">注册</a></p>
</div>
<script>
    const FAIL = 2;
    const SUCCESS = 6;
    const SUCCESS_CODE = 0;

    layui.use('jquery', function (){
        let $ = layui.jquery;
        let form = layui.form;

        // 提交表单
        form.on('submit(loginBtn)', function(){
            $.ajax({
                type: 'post',
                url: '/api/admin/login',
                data: {
                    username: $("[name='username']").val(),
                    password: $("[name='password']").val(),
                },
                dataType: 'json',
                success(res) {
                    if (res.code === SUCCESS_CODE) {
                        layer.msg(res['msg'], {icon: SUCCESS});
                        location.href = '{$redirectUrl}';
                    }
                    else {
                        layer.msg(res['msg'], {icon: FAIL});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
